<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="WhatSupp">
  <!-- Speech-bubble silhouette in CSS-deck lavender purple (#BC72F0) -->
  <path
    d="M32 4
       C 16.0 4 4 16.0 4 30
       C 4 35.4 5.7 40.5 8.6 44.7
       L 4.8 56.6
       C 4.3 58.1 5.7 59.5 7.2 59.0
       L 19.2 55.4
       C 23.0 57.7 27.4 59 32 59
       C 47.9 59 60 47.0 60 32
       C 60 17.0 47.9 4 32 4 Z"
    fill="#BC72F0"
  />
  <!-- Capsule / pill — symbolic of supplements, tilted 45° -->
  <g transform="translate(32 32) rotate(-45) translate(-32 -32)">
    <rect
      x="20"
      y="27.5"
      width="24"
      height="9"
      rx="4.5"
      ry="4.5"
      fill="#F5E9FF"
    />
    <!-- Capsule split line -->
    <line
      x1="32"
      y1="27.5"
      x2="32"
      y2="36.5"
      stroke="#4F3478"
      stroke-width="1.4"
      opacity="0.55"
    />
  </g>
  <!-- Pink accent dot — the CSS-deck pink spark (#DE478E) -->
  <circle cx="46.5" cy="20" r="3.4" fill="#DE478E" />
</svg>
